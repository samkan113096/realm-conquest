name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  web-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify Realm Conquest browser game files
        run: |
          test -f realm-conquest-browser/index.html
          test -f realm-conquest-browser/js/game.js
          node --check realm-conquest-browser/js/game.js
          node --check realm-conquest-browser/js/ai.js
          node --check realm-conquest-browser/js/config.js

  pc-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r neon-drift-pc/requirements.txt
      - name: Syntax check Python files
        run: |
          python -m py_compile neon-drift-pc/main.py
          python -m py_compile neon-drift-pc/game.py
          python -m py_compile neon-drift-pc/player.py
          python -m py_compile neon-drift-pc/entities.py
          python -m py_compile neon-drift-pc/powerups.py

  gamefi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install and test GameFi
        working-directory: gamefi
        run: |
          npm install
          npm run compile
          npm test

  phone-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: shadow-strike-mobile
        run: npm install
      - name: Verify app structure
        run: |
          test -f shadow-strike-mobile/App.js
          test -f shadow-strike-mobile/src/components/GameScreen.js
          node --check shadow-strike-mobile/App.js
